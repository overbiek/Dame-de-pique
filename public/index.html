<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>Dame de Pique</title>

<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#0a3d2b"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Dame de Pique"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="icon" href="/icon-192.png"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --felt-0:#0d4a33; --felt-1:#0a3527; --felt-2:#062018;
  --gold:#d4af5c; --gold-lo:#a8862f; --gold-hi:#f0d68f;
  --cream:#f4efe4; --muted:rgba(244,239,228,.55); --faint:rgba(244,239,228,.32);
  --line:rgba(244,239,228,.10);
  --card-face:#fdfaf2; --card-edge:#d8d2c4;
  --red:#c0392b; --ink:#20242a;
  --ok:#3fbf88; --warn:#e0a04a;
  --r:14px;

  --cw:clamp(38px,10.2vw,54px);
  --ch:calc(var(--cw) * 1.42);
  --overlap:calc(var(--cw) * -0.40);
  --pad:clamp(12px,3.6vw,20px);
}

html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  color:var(--cream);
  background:var(--felt-2);
  background-image:
    radial-gradient(120% 80% at 50% 0%,rgba(30,140,96,.30) 0%,transparent 62%),
    radial-gradient(100% 70% at 50% 100%,rgba(4,20,14,.75) 0%,transparent 60%),
    linear-gradient(170deg,var(--felt-0) 0%,var(--felt-1) 55%,var(--felt-2) 100%);
  background-attachment:fixed;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
/* subtle felt weave */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
                   repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);
}

#app{
  position:relative;z-index:1;
  max-width:760px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + var(--pad)) var(--pad)
          calc(env(safe-area-inset-bottom) + var(--pad));
  min-height:100%;
}

.screen{display:none;animation:fade .3s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,8vw,2.7rem);font-weight:700;
   color:var(--gold);letter-spacing:.01em;line-height:1.1}
h2{font-family:'Playfair Display',serif;font-size:clamp(1.15rem,4.4vw,1.5rem);font-weight:600;color:var(--gold-hi);margin-bottom:.6rem}
p{font-size:.9rem;color:var(--muted);line-height:1.6}

/* ══ Buttons ══ */
.btn{
  font:600 .92rem/1 'DM Sans',sans-serif;
  padding:14px 22px;border-radius:var(--r);cursor:pointer;
  border:1px solid rgba(212,175,92,.38);
  background:rgba(212,175,92,.10);color:var(--gold-hi);
  transition:transform .12s,background .18s,box-shadow .18s;
  touch-action:manipulation;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-primary{
  background:linear-gradient(175deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
  color:#2a1e05;border-color:transparent;
  box-shadow:0 4px 14px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.4);
}
.btn-block{display:block;width:100%}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--muted)}

input[type=text]{
  width:100%;font:500 1rem 'DM Sans',sans-serif;padding:14px 16px;
  border-radius:var(--r);border:1px solid rgba(212,175,92,.26);
  background:rgba(0,0,0,.22);color:var(--cream);
}
input[type=text]:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.32)}
input[type=text]::placeholder{color:var(--faint)}

/* ══ Playing cards ══ */
.card{
  position:relative;flex:0 0 auto;
  width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.13);
  background:linear-gradient(158deg,#fffdf7,var(--card-face) 55%,#f2ecdd);
  border:1px solid var(--card-edge);color:var(--ink);
  box-shadow:0 2px 5px rgba(0,0,0,.35);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .16s,opacity .16s;
  user-select:none;
}
.card .ix{
  position:absolute;top:5%;left:8%;line-height:.98;
  font-weight:700;font-size:calc(var(--cw)*.32);letter-spacing:-.02em;
}
.card .ix small{display:block;font-size:calc(var(--cw)*.30);font-weight:600}
.card .big{
  position:absolute;right:6%;bottom:3%;
  font-size:calc(var(--cw)*.62);line-height:1;opacity:.22;
}
.card.red{color:var(--red)}
.card.blk{color:var(--ink)}
.card.pen{background:linear-gradient(158deg,#fff8f4,#ffeee8 60%,#ffe2d8);border-color:#e9b9a6}
.card.tap{cursor:pointer}
.card.tap:active{transform:translateY(-14px) scale(1.04);box-shadow:0 12px 22px rgba(0,0,0,.45)}
.card.sel{transform:translateY(-16px);box-shadow:0 12px 24px rgba(0,0,0,.45),0 0 0 2px var(--gold)}
.card.dim{opacity:.32;filter:saturate(.5)}
.card.back{
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 3px,transparent 3px 6px),
    linear-gradient(160deg,#1d5e8a,#123f5e);
  border-color:#0d2f47;
}
.card.mini{--cw:clamp(24px,6vw,32px)}

/* ══ Hand ══ */
.hand{
  display:flex;align-items:flex-end;
  padding:22px 4px 8px;
  overflow-x:auto;overflow-y:visible;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.hand::-webkit-scrollbar{display:none}
.suitgrp{display:flex;flex:0 0 auto}
.suitgrp + .suitgrp{margin-left:11px}
.suitgrp .card + .card{margin-left:var(--overlap)}
.hand .card.tap:active,.hand .card.sel{z-index:5}

/* ══ Table ══ */
.table{
  position:relative;
  border-radius:22px;
  background:radial-gradient(70% 55% at 50% 42%,rgba(46,168,116,.20),rgba(0,0,0,.30) 78%);
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.30);
  padding:12px 10px;
  display:grid;
  grid-template-areas:"lt top rt" "lft mid rgt" "lb bot rb";
  grid-template-columns:minmax(58px,1fr) auto minmax(58px,1fr);
  align-items:center;justify-items:center;
  gap:6px;
}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:100%}
.seat-top{grid-area:top}
.seat-left{grid-area:lft}
.seat-right{grid-area:rgt}
.mid{grid-area:mid;display:grid;
  grid-template-areas:". t ." "l . r" ". b .";
  place-items:center;gap:3px;min-width:calc(var(--cw)*2.6);min-height:calc(var(--ch)*2.3)}
.mid .slot-t{grid-area:t}.mid .slot-l{grid-area:l}
.mid .slot-r{grid-area:r}.mid .slot-b{grid-area:b}
.ghost{width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.13);
  border:1px dashed rgba(255,255,255,.13)}

.avatar{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;
  background:rgba(0,0,0,.30);border:1.5px solid var(--line);color:var(--cream);
  transition:box-shadow .25s,border-color .25s;
}
.seat.turn .avatar{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,92,.22),0 0 16px rgba(212,175,92,.35)}
.seat.off .avatar{opacity:.4}
.seat.ai .avatar{border-color:rgba(110,180,255,.5);color:#a8d4ff}
.seat-name{font-size:.72rem;color:var(--muted);max-width:76px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center}
.seat-score{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:600;color:var(--gold-hi)}
.seat-cards{display:flex;justify-content:center}
.seat-cards .card{margin-left:-16px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.seat-cards .card:first-child{margin-left:0}
.count-pill{font-size:.62rem;color:var(--faint);letter-spacing:.04em}

/* ══ Chrome / info ══ */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{
  font-size:.72rem;font-weight:500;letter-spacing:.02em;
  color:var(--muted);background:rgba(0,0,0,.24);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;
}
.chip b{color:var(--cream);font-weight:600}
.chip.hot{color:#f0b49a;border-color:rgba(240,180,154,.28)}
.chip.cool{color:#8fe0be;border-color:rgba(143,224,190,.24)}

.banner{
  text-align:center;font-size:.85rem;font-weight:500;
  color:var(--gold-hi);min-height:1.3em;margin:10px 0 4px;
}
.prompt{
  text-align:center;font-size:.95rem;font-weight:600;color:var(--cream);
  margin:12px 0 2px;
}
.prompt.wait{color:var(--faint);font-weight:500;font-style:italic}

.note{
  border-radius:var(--r);padding:13px 16px;font-size:.86rem;line-height:1.5;
  background:rgba(63,191,136,.10);border:1px solid rgba(63,191,136,.26);color:#a8ecce;
  margin:.75rem 0;
}
.note.gold{background:rgba(212,175,92,.10);border-color:rgba(212,175,92,.30);color:var(--gold-hi)}
.note.bad{background:rgba(200,70,60,.12);border-color:rgba(200,70,60,.30);color:#f3ada4}

.divider{height:1px;background:var(--line);margin:14px 0}

/* ══ Landing ══ */
.center-wrap{max-width:400px;margin:0 auto;text-align:center;padding-top:6vh}
.tagline{font-size:.9rem;color:var(--faint);font-style:italic;margin:6px 0 26px}
.stack>*+*{margin-top:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:.78rem;margin:22px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.row{display:flex;gap:8px}
.row .grow{flex:1;min-width:0}

/* ══ Lobby ══ */
.codebox{
  background:rgba(0,0,0,.24);border:1px solid rgba(212,175,92,.26);
  border-radius:18px;padding:16px;text-align:center;margin:14px 0;
}
.code{font-family:'Playfair Display',serif;font-size:clamp(2.1rem,10vw,2.9rem);
  font-weight:700;color:var(--gold);letter-spacing:.22em;text-indent:.22em;line-height:1.15}
.codehint{font-size:.75rem;color:var(--faint);margin-top:6px}
.slot{
  display:flex;align-items:center;gap:11px;
  padding:12px 14px;border-radius:var(--r);
  background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:8px;
}
.slot .dot{width:8px;height:8px;border-radius:50%;background:rgba(244,239,228,.20);flex:0 0 auto}
.slot .dot.on{background:var(--ok);box-shadow:0 0 8px rgba(63,191,136,.6)}
.slot .dot.bot{background:#6cb6ff;box-shadow:0 0 8px rgba(108,182,255,.5)}
.slot .nm{flex:1;font-size:.92rem;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;flex:0 0 auto}
.tag.you{background:rgba(63,191,136,.16);color:#8fe0be;border:1px solid rgba(63,191,136,.3)}
.tag.bot{background:rgba(108,182,255,.14);color:#a8d4ff;border:1px solid rgba(108,182,255,.3)}
.mini-btn{font:600 .72rem 'DM Sans',sans-serif;padding:7px 13px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(108,182,255,.32);background:rgba(108,182,255,.10);color:#a8d4ff;flex:0 0 auto}
.mini-btn.on{background:rgba(108,182,255,.26);border-color:rgba(108,182,255,.55)}

/* ══ Draw ══ */
.drawrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.drawcard{
  width:clamp(62px,17vw,78px);aspect-ratio:.72;border-radius:12px;
  display:grid;place-items:center;text-align:center;
  border:1.5px solid rgba(212,175,92,.30);background:rgba(0,0,0,.24);
  box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .18s,box-shadow .18s;
}
.drawcard.tap{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,92,.16)}
.drawcard.tap:active{transform:translateY(-5px)}
.drawcard.flip{background:linear-gradient(158deg,#fffdf7,var(--card-face));border-color:var(--card-edge);color:var(--ink)}
.drawcard.win{border-color:var(--gold);border-width:2px;box-shadow:0 0 20px rgba(212,175,92,.35)}
.dcr{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700}
.dcs{font-size:1.5rem;line-height:1}
.dcn{font-size:.62rem;color:var(--faint);margin-top:3px;max-width:66px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.drawcard.flip .dcn{color:#7a7266}

/* ══ Tables / scores ══ */
.scores{width:100%;border-collapse:collapse;font-size:.9rem;margin:.6rem 0}
.scores th{text-align:left;padding:9px 12px;font-size:.68rem;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.scores td{padding:11px 12px;border-bottom:1px solid rgba(244,239,228,.055)}
.scores tr:last-child td{border-bottom:none}
.scores .lead td{color:var(--gold-hi);font-weight:600}
.scores .tot{font-family:'Playfair Display',serif;font-weight:600;font-size:1rem}
.d-pos{color:#7fe0b4}.d-neg{color:#f0968c}.d-neu{color:var(--faint)}

.podium{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.pod{background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 10px;text-align:center}
.pod.win{border-color:var(--gold);background:rgba(212,175,92,.09);
  box-shadow:0 0 24px rgba(212,175,92,.16)}
.pod .n{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--cream)}
.pod .who{font-size:.78rem;color:var(--muted);margin-top:3px}
.pod .crown{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* ══ Connection toast ══ */
#conn{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top) + 8px);z-index:99;
  font-size:.76rem;font-weight:600;padding:7px 15px;border-radius:999px;
  background:rgba(190,120,40,.92);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);
  display:none;
}

/* ══ Install prompt ══ */
#install{display:none;margin-top:14px}

@media(min-width:620px){
  .table{padding:18px 16px;gap:10px}
  .avatar{width:46px;height:46px;font-size:1.15rem}
  .seat-name{font-size:.78rem;max-width:100px}
}
</style>
</head>
<body>

<div id="conn">Reconnecting…</div>

<div id="app">

<!-- ═══ LANDING ═══ -->
<section id="s-landing" class="screen active">
  <div class="center-wrap">
    <h1>Dame de Pique</h1>
    <p class="tagline">Hearts, spades, and cunning</p>

    <div class="stack">
      <input type="text" id="f-name" placeholder="Your name" maxlength="16" autocomplete="nickname"/>
      <button class="btn btn-primary btn-block" onclick="doCreate()">Create a game</button>
    </div>

    <div class="or">or join one</div>

    <div class="stack">
      <div class="row">
        <input class="grow" type="text" id="f-code" placeholder="Room code" maxlength="5"
               style="text-transform:uppercase;letter-spacing:.16em;font-weight:600"/>
        <button class="btn" onclick="doJoin()">Join</button>
      </div>
    </div>

    <div id="err-landing" class="note bad" style="display:none"></div>
    <div id="install"><button class="btn btn-ghost btn-block" onclick="doInstall()">Install as an app</button></div>
  </div>
</section>

<!-- ═══ LOBBY ═══ -->
<section id="s-lobby" class="screen">
  <div class="center-wrap" style="padding-top:2vh;max-width:460px">
    <h2>Game lobby</h2>
    <div class="codebox">
      <p style="font-size:.75rem;color:var(--faint)">Share this code</p>
      <div class="code" id="l-code">·····</div>
      <p class="codehint" id="l-hint" onclick="copyLink()" style="cursor:pointer">Tap to copy invite link</p>
    </div>
    <div id="l-slots"></div>
    <p id="l-status" style="font-size:.82rem;color:var(--faint);margin:10px 0"></p>
    <button class="btn btn-primary btn-block" id="l-start" onclick="send('startGame')" disabled>Start game</button>
    <p id="l-wait" class="prompt wait" style="display:none">Waiting for the host to start…</p>
    <div id="err-lobby" class="note bad" style="display:none"></div>
  </div>
</section>

<!-- ═══ DRAW ═══ -->
<section id="s-draw" class="screen">
  <div class="center-wrap" style="padding-top:3vh;max-width:460px">
    <h2>Cut for dealer</h2>
    <p>Highest card deals first.</p>
    <div id="d-row" class="drawrow"></div>
    <div id="d-note" class="note gold" style="display:none"></div>
    <button class="btn btn-primary btn-block" id="d-begin" style="display:none" onclick="send('startRound')">Begin round 1</button>
    <p id="d-wait" class="prompt wait" style="display:none">Waiting for the host…</p>
  </div>
</section>

<!-- ═══ PASS ═══ -->
<section id="s-pass" class="screen">
  <div class="topbar" id="p-bar"></div>
  <div class="table" id="p-table"></div>
  <p class="prompt" id="p-prompt"></p>
  <div class="hand" id="p-hand"></div>
  <button class="btn btn-primary btn-block" id="p-go" onclick="confirmPass()" disabled>Pass 2 cards</button>
</section>

<!-- ═══ PLAY ═══ -->
<section id="s-play" class="screen">
  <div class="topbar" id="g-bar"></div>
  <div class="table" id="g-table"></div>
  <p class="banner" id="g-banner"></p>
  <p class="prompt" id="g-prompt"></p>
  <div class="hand" id="g-hand"></div>
</section>

<!-- ═══ ROUND SUMMARY ═══ -->
<section id="s-summary" class="screen">
  <div class="center-wrap" style="padding-top:2vh;max-width:460px;text-align:left">
    <h2 id="r-title">Round complete</h2>
    <div id="r-body"></div>
    <button class="btn btn-primary btn-block" id="r-next" style="display:none" onclick="send('nextRound')">Next round</button>
    <p id="r-wait" class="prompt wait" style="display:none">Waiting for the host…</p>
  </div>
</section>

<!-- ═══ FINAL ═══ -->
<section id="s-final" class="screen">
  <div class="center-wrap" style="padding-top:2vh;max-width:480px;text-align:left">
    <h2>Final standings</h2>
    <div id="f-body"></div>
    <button class="btn btn-ghost btn-block" style="margin-top:14px" onclick="newGame()">New game</button>
  </div>
</section>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";

const SUITS=['♠','♥','♦','♣'];
const RED=new Set(['♥','♦']);
const socket=io({reconnectionDelayMax:4000});

let S=null;            // latest game state
let me=-1, room='', host=false, token='';
let picked=[];         // cards selected to pass

/* ── storage (survives app backgrounding) ── */
const SK='ddp.session';
function saveSession(){ try{localStorage.setItem(SK,JSON.stringify({room,token}));}catch(e){} }
function loadSession(){ try{return JSON.parse(localStorage.getItem(SK)||'null');}catch(e){return null;} }
function clearSession(){ try{localStorage.removeItem(SK);}catch(e){} }

/* ── helpers ── */
const $=id=>document.getElementById(id);
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('s-'+id).classList.add('active');
}
function send(ev,extra){ socket.emit(ev,Object.assign({code:room,playerIndex:me},extra||{})); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initial(n){ return (String(n).trim()[0]||'?').toUpperCase(); }
function isPen(c){ return c.suit==='♥'||(c.suit==='♠'&&c.rank==='Q'); }
function seatOf(i){ return (i-me+4)%4; }   // 0 bottom(me) 1 left 2 top 3 right
function toast(id,msg){ const e=$(id); if(!e)return; e.textContent=msg; e.style.display='block';
  clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',4500); }

function cardHTML(c,cls){
  const col=RED.has(c.suit)?'red':'blk';
  return `<div class="card ${col} ${isPen(c)?'pen':''} ${cls||''}" data-r="${c.rank}" data-s="${c.suit}">
    <span class="ix">${c.rank}<small>${c.suit}</small></span>
    <span class="big">${c.suit}</span>
  </div>`;
}
function backHTML(cls){ return `<div class="card back ${cls||''}"></div>`; }

function handHTML(hand,mode,legal){
  if(!hand||!hand.length) return '';
  const groups={'♠':[],'♥':[],'♦':[],'♣':[]};
  hand.forEach(c=>groups[c.suit].push(c));
  let h='';
  for(const s of SUITS){
    if(!groups[s].length) continue;
    h+='<div class="suitgrp">';
    for(const c of groups[s]){
      let cls='';
      if(mode==='pass'){
        cls='tap'+(picked.some(p=>p.rank===c.rank&&p.suit===c.suit)?' sel':'');
      }else if(mode==='play'){
        cls=legal.has(c.rank+'|'+c.suit)?'tap':'dim';
      }
      h+=cardHTML(c,cls);
    }
    h+='</div>';
  }
  return h;
}

/* ── seat rendering ── */
function seatHTML(G,i,opts){
  const p=G.players[i];
  const turn=opts&&opts.turn;
  const cls=[p.isAI?'ai':'',turn?'turn':'',(!p.connected&&!p.isAI)?'off':''].join(' ');
  const n=Math.min(p.cardCount,8);
  let fan='';
  if(opts&&opts.fan&&p.cardCount>0){
    for(let k=0;k<n;k++) fan+=backHTML('mini');
  }
  return `<div class="seat ${cls}">
    <div class="avatar">${esc(initial(p.name))}</div>
    <div class="seat-name">${esc(p.name)}${i===G.dealer?' •':''}</div>
    <div class="seat-score">${p.score}</div>
    ${fan?`<div class="seat-cards">${fan}</div><span class="count-pill">${p.cardCount}</span>`:''}
  </div>`;
}

function tableHTML(G,opts){
  opts=opts||{};
  const byPos={};
  for(let i=0;i<4;i++) byPos[seatOf(i)]=i;
  const cur=(G.trickLeader+G.currentTrick.length)%4;
  const active=G.phase==='play'&&G.currentTrick.length<4?cur:-1;

  const seat=pos=>{
    const i=byPos[pos];
    return seatHTML(G,i,{turn:i===active,fan:opts.fan});
  };

  // middle: played cards positioned by seat
  const played=p=>{
    const i=byPos[p];
    const t=G.currentTrick.find(x=>x.player===i);
    return t?cardHTML(t.card,''):'<div class="ghost"></div>';
  };

  return `
    <div class="seat-top">${seat(2)}</div>
    <div class="seat-left">${seat(1)}</div>
    <div class="seat-right">${seat(3)}</div>
    <div class="mid">
      <div class="slot-t">${played(2)}</div>
      <div class="slot-l">${played(1)}</div>
      <div class="slot-r">${played(3)}</div>
      <div class="slot-b">${played(0)}</div>
    </div>`;
}

/* ══════════ LANDING ══════════ */
function doCreate(){
  const n=$('f-name').value.trim();
  if(!n){ $('f-name').focus(); return; }
  socket.emit('createRoom',{name:n});
}
function doJoin(){
  const n=$('f-name').value.trim();
  const c=$('f-code').value.trim().toUpperCase();
  if(!n){ toast('err-landing','Enter your name first.'); $('f-name').focus(); return; }
  if(!c){ $('f-code').focus(); return; }
  socket.emit('joinRoom',{code:c,name:n});
}
function newGame(){ clearSession(); location.href=location.pathname; }

socket.on('joined',d=>{
  room=d.code; me=d.playerIndex; host=d.isHost; token=d.token;
  saveSession();
  $('l-code').textContent=room;
});
socket.on('errorMsg',d=>{
  const target=$('s-lobby').classList.contains('active')?'err-lobby':'err-landing';
  toast(target,d.msg);
});
socket.on('error',d=>{ if(d&&d.msg) toast('err-landing',d.msg); });
socket.on('rejoinFailed',()=>{ clearSession(); });

/* connection status */
socket.on('connect',()=>{
  $('conn').style.display='none';
  const s=loadSession();
  if(s&&s.room&&s.token&&me===-1){ socket.emit('rejoin',{code:s.room,token:s.token}); }
  else if(room&&token){ socket.emit('rejoin',{code:room,token}); }
});
socket.on('disconnect',()=>{ $('conn').style.display='block'; });

/* ══════════ ROUTER ══════════ */
socket.on('gameState',G=>{
  S=G; me=G.myIndex; host=G.isHost;
  switch(G.phase){
    case 'lobby':        renderLobby(G); break;
    case 'draw':
    case 'drawDone':     renderDraw(G);  break;
    case 'pass':         renderPass(G);  break;
    case 'play':         renderPlay(G);  break;
    case 'roundSummary': renderSummary(G); break;
    case 'final':        renderFinal(G); break;
  }
});

/* ══════════ LOBBY ══════════ */
function copyLink(){
  const url=location.origin+location.pathname+'?join='+room;
  const done=()=>{ $('l-hint').textContent='Copied!';
    setTimeout(()=>$('l-hint').textContent='Tap to copy invite link',1800); };
  if(navigator.share){ navigator.share({title:'Dame de Pique',text:`Join my game — code ${room}`,url}).catch(()=>{}); return; }
  navigator.clipboard.writeText(url).then(done).catch(done);
}
function toggleAI(i){
  const p=S.players[i];
  socket.emit('setAI',{code:room,slotIndex:i,isAI:!p.isAI});
}
function renderLobby(G){
  show('lobby');
  $('l-code').textContent=G.code;
  let h='';
  for(let i=0;i<4;i++){
    const p=G.players[i];
    const dot=p.isAI?'bot':p.connected?'on':'';
    h+=`<div class="slot">
      <span class="dot ${dot}"></span>
      <span class="nm">${esc(p.name)}</span>
      ${i===me?'<span class="tag you">you</span>':''}
      ${p.isAI?'<span class="tag bot">AI</span>':''}
      ${host&&i>0&&!p.connected||host&&i>0&&p.isAI
        ? `<button class="mini-btn ${p.isAI?'on':''}" onclick="toggleAI(${i})">${p.isAI?'AI on':'Add AI'}</button>`:''}
    </div>`;
  }
  $('l-slots').innerHTML=h;
  const ready=G.players.every(p=>p.connected||p.isAI);
  $('l-status').textContent=ready?'All four seats are filled.':'Waiting for players…';
  $('l-start').style.display=host?'block':'none';
  $('l-start').disabled=!ready;
  $('l-wait').style.display=host?'none':'block';
}

/* ══════════ DRAW ══════════ */
function renderDraw(G){
  show('draw');
  let h='';
  for(let i=0;i<4;i++){
    const p=G.players[i], up=G.drawRevealed[i], c=G.drawCards[i];
    const mine=i===me && !up && G.phase==='draw';
    if(up&&c){
      h+=`<div class="drawcard flip ${G.dealer===i?'win':''}">
        <div>
          <div class="dcr ${RED.has(c.suit)?'':''}" style="color:${RED.has(c.suit)?'var(--red)':'var(--ink)'}">${c.rank}</div>
          <div class="dcs" style="color:${RED.has(c.suit)?'var(--red)':'var(--ink)'}">${c.suit}</div>
          <div class="dcn">${esc(p.name)}</div>
        </div>
      </div>`;
    }else{
      h+=`<div class="drawcard ${mine?'tap':''}" ${mine?'onclick="send(\'revealDraw\')"':''}>
        <div><div style="font-size:1.5rem">🂠</div><div class="dcn">${esc(p.name)}</div></div>
      </div>`;
    }
  }
  $('d-row').innerHTML=h;

  const done=G.phase==='drawDone';
  const note=$('d-note');
  if(done){
    note.style.display='block';
    note.textContent=`${G.players[G.dealer].name} deals first.`;
  } else note.style.display='none';
  $('d-begin').style.display=done&&host?'block':'none';
  $('d-wait').style.display=done&&!host?'block':'none';
}

/* ══════════ PASS ══════════ */
function renderPass(G){
  show('pass');
  const dir=['left','right','across','keep'][(G.round-1)%4];
  $('p-bar').innerHTML=
    `<span class="chip">Round <b>${G.round}</b>/${G.totalRounds}</span>
     <span class="chip">Pass <b>${dir}</b></span>
     <span class="chip">Dealer <b>${esc(G.players[G.dealer].name)}</b></span>`;
  $('p-table').innerHTML=tableHTML(G,{fan:true});

  const mine=G.players[me];
  if(mine.hasPassed){
    const left=G.players.filter(p=>!p.hasPassed).length;
    $('p-prompt').className='prompt wait';
    $('p-prompt').textContent=`Cards locked in — waiting for ${left} more player${left===1?'':'s'}…`;
    $('p-hand').innerHTML=handHTML(G.myHand,null,null);
    $('p-go').style.display='none';
  }else{
    $('p-prompt').className='prompt';
    $('p-prompt').textContent=`Choose 2 cards to pass ${dir}`;
    $('p-hand').innerHTML=handHTML(G.myHand,'pass',null);
    const b=$('p-go');
    b.style.display='block';
    b.disabled=picked.length!==2;
    b.textContent=picked.length===2?`Pass these 2 cards`:`Pass 2 cards (${picked.length}/2)`;
  }
}
$('p-hand').addEventListener('click',e=>{
  const el=e.target.closest('.card.tap'); if(!el||!S||S.phase!=='pass')return;
  const c={rank:el.dataset.r,suit:el.dataset.s};
  const at=picked.findIndex(p=>p.rank===c.rank&&p.suit===c.suit);
  if(at>=0) picked.splice(at,1);
  else if(picked.length<2) picked.push(c);
  else { picked.shift(); picked.push(c); }
  renderPass(S);
});
function confirmPass(){
  if(picked.length!==2)return;
  socket.emit('selectPass',{code:room,playerIndex:me,cards:picked});
  picked=[];
}

/* ══════════ PLAY ══════════ */
function renderPlay(G){
  show('play');
  const broken=G.round===1&&G.heartsbroken;
  $('g-bar').innerHTML=
    `<span class="chip">Round <b>${G.round}</b>/${G.totalRounds}</span>
     <span class="chip">Trick <b>${G.trickNum}</b>/13</span>
     ${G.round===1
        ? `<span class="chip ${broken?'hot':''}">${broken?'♥ broken':'♥ locked'}</span>`
        : `<span class="chip cool">♥ ♠Q free</span>`}`;
  $('g-table').innerHTML=tableHTML(G,{fan:true});
  $('g-banner').textContent=G.lastTrickMsg||'';

  const cur=(G.trickLeader+G.currentTrick.length)%4;
  const myTurn=cur===me&&G.currentTrick.length<4;
  const legal=new Set(G.legalCards||[]);

  const pr=$('g-prompt');
  if(myTurn){ pr.className='prompt'; pr.textContent='Your turn — play a card'; }
  else{ pr.className='prompt wait';
        pr.textContent=G.currentTrick.length===4?'…':`Waiting for ${G.players[cur].name}`; }

  $('g-hand').innerHTML=handHTML(G.myHand,myTurn?'play':null,legal);
}
$('g-hand').addEventListener('click',e=>{
  const el=e.target.closest('.card.tap'); if(!el||!S||S.phase!=='play')return;
  socket.emit('playCard',{code:room,playerIndex:me,card:{rank:el.dataset.r,suit:el.dataset.s}});
});

/* ══════════ SUMMARY ══════════ */
function scoreRows(G,withDelta){
  const rows=G.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
  let h='<table class="scores"><thead><tr><th>Player</th>'
       +(withDelta?'<th>Round</th>':'')+'<th>Total</th></tr></thead><tbody>';
  rows.forEach((p,n)=>{
    let d='';
    if(withDelta){
      const v=p.score-G.roundBefore[p.i];
      const cl=v>0?'d-pos':v<0?'d-neg':'d-neu';
      d=`<td class="${cl}">${v>0?'+':''}${v}</td>`;
    }
    h+=`<tr class="${n===0?'lead':''}">
      <td>${esc(p.name)}${p.isAI?' <span class="tag bot">AI</span>':''}${p.i===me?' <span class="tag you">you</span>':''}</td>
      ${d}<td class="tot">${p.score}</td></tr>`;
  });
  return h+'</tbody></table>';
}
function renderSummary(G){
  show('summary');
  $('r-title').textContent=`Round ${G.round} of ${G.totalRounds} complete`;
  let h='';
  if(G.moonShooter>=0)
    h+=`<div class="note gold"><b>${esc(G.players[G.moonShooter].name)}</b> shot the moon — +60, and −20 for everyone else.</div>`;
  h+=scoreRows(G,true);
  $('r-body').innerHTML=h;
  $('r-next').style.display=host?'block':'none';
  $('r-next').textContent=`Start round ${G.round+1}`;
  $('r-wait').style.display=host?'none':'block';
}

/* ══════════ FINAL ══════════ */
function renderFinal(G){
  show('final');
  const rows=G.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
  let h='<div class="podium">';
  rows.forEach((p,n)=>{
    h+=`<div class="pod ${n===0?'win':''}">
      ${n===0?'<div class="crown">winner</div>':''}
      <div class="n">${p.score}</div>
      <div class="who">${esc(p.name)}${p.i===me?' (you)':''}${p.isAI?' · AI':''}</div>
    </div>`;
  });
  h+='</div>'+scoreRows(G,false);
  $('f-body').innerHTML=h;
  clearSession();
}

/* ══════════ PWA ══════════ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e; $('install').style.display='block';
});
function doInstall(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; $('install').style.display='none'; });
}
window.addEventListener('appinstalled',()=>{ $('install').style.display='none'; });

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}

/* prefill code from invite link */
(function(){
  const c=new URLSearchParams(location.search).get('join');
  if(c) $('f-code').value=c.toUpperCase();
  const s=loadSession();
  if(s&&s.room){ room=s.room; token=s.token; }
})();

/* stop pinch-zoom double taps from firing plays twice */
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
</script>
